# Starting values (C-12). Tune here, never in code.
# Relative paths are resolved from the root of this repo.
paths:
  dataset_root: ../dataset                  # the private dataset repo, checked out next to this one
  synthetic_root: ../synthetic/evidence     # synthetic before/after renders (synthetic/synth_evidence.py)
  build_dir: data/yolo                      # generated, git-ignored
  effect_cache: data/effect_cache           # generated, git-ignored
  detector_weights: models/detector-yolo11n-640-synth.pt   # git-ignored; see reports/yolo11n-640-synth.md
  effect_weights: models/effect-check-v1.pt                 # git-ignored
  prior: linker/prior.json
  # Model files the Engine loads (ai_engine). null = not trained yet: the call answers safely.
  state_weights: null                       # M-S1b, planned
  devices_weights: null                     # M-S2, planned
  people_weights: models/yolo11s.pt         # pretrained COCO YOLO, git-ignored; FR-10 needs it
  fingerprint_weights: null                 # DINOv2 small, planned

detector:
  # The three control kinds of data-model.md. The order is the YOLO class id.
  classes: [switch, toggle, power_strip]
  # roboflow-switch-3inct boxes the whole plate, not the key.
  exclude_folders: [roboflow-switch-3inct]
  synthetic_crop_zoom: [2, 5]     # a synthetic crop is this many plate widths wide
  train:
    model: yolo11n.pt
    imgsz: 640
    epochs: 60
    patience: 15
    batch: 16
    workers: 2
    device: mps
  predict:
    conf: 0.3
    imgsz: 640
  kind_map: null            # only for detector-v1: {switch: switch, push_button: switch, toggle: toggle}

linker:
  alpha: 3.0                # weight of the coarser level when a finer level has few counts
  floor: 0.1                # share of every guess spread evenly, so nothing is certain before a press
  out_of_view_share: 0.12   # base chance that a key runs something not listed (a fan, another room)
  unused_p: 0.3             # chance that a listed device is run by a switch elsewhere
  label_weight: {certain: 1.0, likely: 0.8, guess: 0.5}
  plate_gap: 1.0            # keys closer than this many key widths are on one plate

effect_check:
  lamp_min: 0.5             # a lamp crop counts as changed above this
  scene_min: 0.5            # the whole picture counts as changed above this
  held_out_folders: 2       # the last synthetic seed folders, kept out of training
  epochs: 8
  simple:                   # the plain brightness check (effect_check/change_check.py)
    min_change: 0.06
    min_share: 0.02
  spot:                     # finding the lamp that changed when no lamp box is known
    min_rise: 0.12
    min_lit: 0.45

# ---------- Engine calls (ai_engine), wiki: API > ai-engine interface
engine:
  device: cpu               # the enclave has no GPU

state:
  threshold: 0.7            # below it the state is unknown (A-03)

clear:
  min_score: 0.5
  min_sharpness: 80         # variance of the Laplacian, 0 to 255 scale

fingerprint:
  similarity_to_refind: 0.7 # FR-09

change:
  grid: 8                   # the region is split into grid x grid cells
  cell_min: 0.06            # a cell changed when its mean luminance moved this much
  threshold: 0.3            # share of changed cells for a clear change (C-08)

devices:
  conf: 0.5

check:
  light:
    upper: 0.25             # lamp area brightness change (0 to 1) for yes
    lower: 0.05             # at or below it: no
    scene_upper: 0.08       # the same for the whole frame, the second check
    scene_lower: 0.02
  fan:
    upper: null             # motion change; to be measured on the demo fan, unsure until then
    lower: null

people:
  conf: 0.25                # low on purpose: a missed person is worse than a cancelled press

refind:
  max_shift: 0.1            # the control's center may move this share of the image
  require_fingerprint: true # FR-09: no press without a fingerprint match

press:
  planner: script           # motion planner (C-13): script now, a VLA model later
  push_ms: {switch: 400, toggle: 400, power_strip: 400}
